[project]
name = "mcp-oracle-poc"
version = "1.0.0"
description = "POC d'un serveur MCP (Model Context Protocol) exposant des outils pour interagir avec une base de données Oracle."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0.0",
    "oracledb>=2.4.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
mcp-oracle-poc = "mcp_oracle_poc.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_oracle_poc"]
